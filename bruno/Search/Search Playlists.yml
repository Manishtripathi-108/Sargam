http:
  method: GET
  url: "{{baseUrl}}/api/search/playlists?q=bollywood hits&limit=10&offset=0&provider=saavn"
  params:
    - name: q
      value: bollywood hits
      type: query
    - name: limit
      value: "10"
      type: query
    - name: offset
      value: "0"
      type: query
