info:
  name: Global Search
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/search?q=arijit singh&type=all&limit=10&offset=0&provider=saavn"
  params:
    - name: q
      value: arijit singh
      type: query
    - name: type
      value: all
      type: query
    - name: limit
      value: "10"
      type: query
    - name: offset
      value: "0"
      type: query
    - name: provider
      value: saavn
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
